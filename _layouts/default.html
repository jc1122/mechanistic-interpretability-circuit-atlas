<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="top"><nav>
<a class="home" href="{{ '/' | relative_url }}">Circuit Atlas</a>
<a href="{{ '/INDEX.html' | relative_url }}">Index</a>
<a href="{{ '/GLOSSARY.html' | relative_url }}">Glossary</a>
<a href="{{ '/METHODS.html' | relative_url }}">Methods</a>
<a href="{{ '/REFERENCES.html' | relative_url }}">References</a>
</nav></header>
<main>
{{ content }}
</main>
<footer>
<p>Text CC BY 4.0 (<a href="{{ '/LICENSE' | relative_url }}">licence</a>); code MIT. Rendered from
<a href="{{ site.github.repository_url }}/blob/{{ site.github.build_revision }}/{{ page.path }}">this page's Markdown source at revision {{ site.github.build_revision | slice: 0, 7 }}</a>,
which remains the reference text.</p>
</footer>
</body>
</html>
