<svg xmlns="http://www.w3.org/2000/svg" width="540" height="837.0" viewBox="0 0 360 558" role="img" aria-labelledby="title desc">
<title id="title">Polynomial integration screening pack stops</title>
<desc id="desc">Recorded stopping steps: answer-only PART26000, scratchpad PART5500, answer-only TRAIN14500, scratchpad TRAIN27000. Three seeds per screening cell. These are stopping points, not seed means or the final ten-seed results. Only scratchpad PART scores 1.0 on withheld fractions. No full gcd/division mechanism is verified.</desc>
