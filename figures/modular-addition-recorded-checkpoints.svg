<svg xmlns="http://www.w3.org/2000/svg" width="640" height="693.3333333333334" viewBox="0 0 360 390" role="img" aria-labelledby="title desc">
<title id="title">Unseen sums improve long after memorisation</title>
<desc id="desc">Unseen sums improve long after memorisation. Unseen sums improve long after memorisation. Held-out accuracy on each seed&#x27;s fixed split of 3481 pairs; training fraction .4. Ten seeds, eight recorded checkpoints; lines only join recorded observations. Training accuracy reached 99% by step 500, but final held-out accuracy did not. Seeds 5 and 8 are highlighted for readability, not separate experimental arms. Seed 0: 0k steps .02, 1k steps .00, 20k steps .02, 40k steps .22, 60k steps .59, 100k steps .80, 200k steps .92, 300k steps .95; Seed 1: 0k steps .02, 1k steps .00, 20k steps .02, 40k steps .27, 60k steps .62, 100k steps .83, 200k steps .91, 300k steps .94; Seed 2: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .24, 60k steps .60, 100k steps .83, 200k steps .91, 300k steps .92; Seed 3: 0k steps .02, 1k steps .00, 20k steps .04, 40k steps .31, 60k steps .60, 100k steps .82, 200k steps .92, 300k steps .93; Seed 4: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .23, 60k steps .50, 100k steps .80, 200k steps .91, 300k steps .94; Seed 5: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .17, 60k steps .41, 100k steps .69, 200k steps .87, 300k steps .91; Seed 6: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .30, 60k steps .60, 100k steps .82, 200k steps .92, 300k steps .94; Seed 7: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .27, 60k steps .55, 100k steps .84, 200k steps .90, 300k steps .93; Seed 8: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .23, 60k steps .55, 100k steps .87, 200k steps .96, 300k steps .97; Seed 9: 0k steps .02, 1k steps .00, 20k steps .01, 40k steps .27, 60k steps .62, 100k steps .88, 200k steps .95, 300k steps .96.</desc>
