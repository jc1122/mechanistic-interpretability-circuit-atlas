<title id="title">Opening-bracket count learning curve</title>
<desc id="desc">Seed 0 at training fraction 0.8. Training reaches 1.0 at step 500; held-out performance improves later, remaining below .90. Points are the archived log entries, joined without smoothing. This is one seed, not the ten-seed range. No closed-form complement certificate is shown.</desc>
