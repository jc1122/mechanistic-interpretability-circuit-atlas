<svg xmlns="http://www.w3.org/2000/svg" width="640" height="693.3333333333334" viewBox="0 0 360 390" role="img" aria-labelledby="title desc">
<title id="title">Memorisation comes before held-out improvement</title>
<desc id="desc">Memorisation comes before held-out improvement. Memorising comes before generalising. Seed 0 at training fraction 0.8. Training reaches 1.0 at step 500; held-out performance improves later, remaining below .90. Points are the archived log entries, joined without smoothing. This is one seed, not the ten-seed range. No closed-form complement certificate is shown.</desc>
