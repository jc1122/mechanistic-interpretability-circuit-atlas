<svg xmlns="http://www.w3.org/2000/svg" width="640" height="693.3333333333334" viewBox="0 0 360 390" role="img" aria-labelledby="title desc">
<title id="title">A mean readout hides differences within the same key</title>
<desc id="desc">A mean readout hides differences within the same key. An average hides differences between matching states. One examined from-scratch retry seed, best snapshot. A mean table fitted on 819 non-training pairs gives whole-output exact match 1.000 on 820 disjoint evaluation pairs. Replacing activations by individual donors with the same output-query and arithmetic key gives .5841 whole-output exact match, despite .99336 token accuracy. This is a sufficient readout only, not a verified native mechanism.</desc>
