<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
<title id="title">Binary multiplication: a mean readout is not an activation identity</title>
<desc id="description">One examined from-scratch retry seed, best snapshot. A mean table fitted on 819 non-training pairs gives whole-output exact match 1.000 on 820 disjoint evaluation pairs. Replacing activations by individual donors with the same output-query and arithmetic key gives .5841 whole-output exact match, despite .99336 token accuracy. This is a sufficient readout only, not a verified native mechanism.</desc>
<style>text{font-family:system-ui,sans-serif} .box{stroke:#63758b;stroke-width:2}</style>
<rect width="900" height="440" rx="16" fill="#f7f9fc"/>
<text x="30" y="42" font-size="24" fill="#172b4d" font-weight="600">A working average can hide context dependence</text>
<text x="30" y="74" font-size="18" fill="#172b4d" font-weight="normal">TRAIN retry, seed 0 best snapshot</text>
<text x="30" y="102" font-size="18" fill="#172b4d" font-weight="normal">819 fit pairs; 820 disjoint evaluation pairs</text>
<text x="30" y="140" font-size="17" fill="#172b4d" font-weight="normal">Same output-query index and arithmetic key in both tests</text>
<line x1="310" y1="169" x2="310" y2="310" stroke="#9bacc0" stroke-width="1"/>
<text x="303" y="337" font-size="17" fill="#172b4d" font-weight="normal">0</text>
<line x1="780" y1="169" x2="780" y2="310" stroke="#9bacc0" stroke-width="1"/>
<text x="773" y="337" font-size="17" fill="#172b4d" font-weight="normal">1.0</text>
<text x="30" y="210" font-size="18" fill="#172b4d" font-weight="normal">Mean output table</text>
<rect x="310" y="185" width="470" height="34" rx="4" fill="#e0e7ef"/>
<rect x="310" y="185" width="470.0" height="34" rx="4" fill="#205b9e"/>
<text x="797" y="210" font-size="20" fill="#172b4d" font-weight="600">1.000</text>
<text x="30" y="290" font-size="18" fill="#172b4d" font-weight="normal">Individual same-key donor</text>
<rect x="310" y="265" width="470" height="34" rx="4" fill="#e0e7ef"/>
<rect x="310" y="265" width="274.527" height="34" rx="4" fill="#6e628f"/>
<text x="797" y="290" font-size="20" fill="#172b4d" font-weight="600">.5841</text>
<text x="310" y="365" font-size="17" fill="#172b4d" font-weight="normal">Teacher-forced whole-output exact match</text>
<text x="30" y="400" font-size="18" fill="#172b4d" font-weight="normal">One seed; sufficient readout only, not a verified native mechanism.</text>
</svg>
