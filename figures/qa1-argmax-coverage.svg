<svg xmlns="http://www.w3.org/2000/svg" width="540" height="2124.0" viewBox="0 0 360 1416" role="img" aria-labelledby="title desc">
<title id="title">Interpretation coverage of 280 second-argmax models</title>
<desc id="desc">Five disjoint groups. At iteration12: 117 resample-tested, 15 flagged optimal-only certificates, 33 read, 115 unexplained. Counts are copied, not recomputed. All binary models include weak and constant predictors. Some resample-tested forms have activation-level or control flags. The 15 optimal-only forms are not atlas-verified resample proofs.</desc>
<ns0:metadata xmlns:ns0="http://www.w3.org/2000/svg">CC BY 4.0</ns0:metadata>
<metadata>CC BY 4.0. Compact redraw; recorded values unchanged. Original figure metadata retained.</metadata>
<style>text{font-family:system-ui,sans-serif}.fg{fill:#172b3a}.bg{fill:#ffffff}.panel{fill:#f0f4f8;stroke:#63758b;stroke-width:1.5}.trained{fill:#fff0ba;stroke:#63758b;stroke-width:1.5}.ink{fill:#172b3a}.grid{stroke:#7d8c98}.track{fill:#e1e6eb}.blue{fill:#176b9b}.amber{fill:#a05a00}.grey{fill:#697681}.light{fill:#e1e6eb;stroke:#63758b}.blue-line{stroke:#176b9b}.amber-line{stroke:#a05a00}.grey-line{stroke:#697681}
@media(prefers-color-scheme:dark){.fg{fill:#f0f6fc}.bg{fill:#161b22}.panel{fill:#263746;stroke:#9bacc0}.trained{stroke:#e3b341}.grid{stroke:#8b949e}.track{fill:#303c49}.blue{fill:#58a6ff}.amber{fill:#e3b341}.grey{fill:#a0adba}.light{fill:#303c49;stroke:#9bacc0}.blue-line{stroke:#58a6ff}.amber-line{stroke:#e3b341}.grey-line{stroke:#a0adba}}</style>
<rect width="360" height="1416" rx="8" class="bg"/>
<text x="20" y="24" font-size="18" class="fg" font-weight="600" text-anchor="start">Second-argmax: interpretation</text>
<text x="20" y="50" font-size="18" class="fg" font-weight="600" text-anchor="start">coverage</text>
<text x="20" y="85" font-size="16" class="fg" font-weight="400" text-anchor="start">Iteration-12 snapshot, 2026-11-13:</text>
<text x="20" y="108" font-size="16" class="fg" font-weight="400" text-anchor="start">280 fixed-length ARC networks.</text>
<text x="20" y="140" font-size="16" class="fg" font-weight="400" text-anchor="start">Model counts, not task accuracy.</text>
<text x="20" y="163" font-size="16" class="fg" font-weight="400" text-anchor="start">Each bar spans its own group.</text>
<text x="20" y="195" font-size="16" class="fg" font-weight="600" text-anchor="start">Two inputs, all widths (n=40)</text>
<rect x="20" y="222" width="320.0" height="16" rx="3" class="blue"/>
<rect x="20" y="252" width="13" height="13" rx="3" class="blue"/>
<text x="44" y="265" font-size="16" class="fg" font-weight="400" text-anchor="start">Resample-tested: 40</text>
<rect x="20" y="277" width="13" height="13" rx="3" class="amber"/>
<text x="44" y="290" font-size="16" class="fg" font-weight="400" text-anchor="start">Optimal-only: 0</text>
<rect x="20" y="302" width="13" height="13" rx="3" class="grey"/>
<text x="44" y="315" font-size="16" class="fg" font-weight="400" text-anchor="start">Read: 0</text>
<rect x="20" y="327" width="13" height="13" rx="3" class="light"/>
