<text x="34" y="36" font-size="23" fill="#172b3a" text-anchor="start">Second-largest position: interpretation coverage</text>
<text x="34" y="64" font-size="15" fill="#172b3a" text-anchor="start">Dated iteration-12 snapshot, 2026-11-13; 280 fixed-length ARC networks</text>
<text x="34" y="90" font-size="14" fill="#172b3a" text-anchor="start">Each bar spans its own group; labels are model counts, not task accuracy.</text>
<text x="34" y="138" font-size="15" fill="#172b3a" text-anchor="start">Two inputs, all widths (n=40)</text>
