<rect x="20" y="592" width="204.8" height="16" rx="3" class="blue"/>
<rect x="224.8" y="592" width="115.2" height="16" rx="3" class="grey"/>
<rect x="20" y="622" width="13" height="13" rx="3" class="blue"/>
<text x="44" y="635" font-size="16" class="fg" font-weight="400" text-anchor="start">Resample-tested: 16</text>
<rect x="20" y="647" width="13" height="13" rx="3" class="amber"/>
<text x="44" y="660" font-size="16" class="fg" font-weight="400" text-anchor="start">Optimal-only: 0</text>
<rect x="20" y="672" width="13" height="13" rx="3" class="grey"/>
<text x="44" y="685" font-size="16" class="fg" font-weight="400" text-anchor="start">Read: 9</text>
<rect x="20" y="697" width="13" height="13" rx="3" class="light"/>
<text x="44" y="710" font-size="16" class="fg" font-weight="400" text-anchor="start">Unexplained: 0</text>
<text x="20" y="750" font-size="16" class="fg" font-weight="600" text-anchor="start">Longer, width 3 (n=25)</text>
<rect x="20" y="777" width="89.6" height="16" rx="3" class="blue"/>
<rect x="109.6" y="777" width="128.0" height="16" rx="3" class="grey"/>
<rect x="237.6" y="777" width="102.4" height="16" rx="3" class="light"/>
<rect x="20" y="807" width="13" height="13" rx="3" class="blue"/>
<text x="44" y="820" font-size="16" class="fg" font-weight="400" text-anchor="start">Resample-tested: 7</text>
<rect x="20" y="832" width="13" height="13" rx="3" class="amber"/>
<text x="44" y="845" font-size="16" class="fg" font-weight="400" text-anchor="start">Optimal-only: 0</text>
<rect x="20" y="857" width="13" height="13" rx="3" class="grey"/>
<text x="44" y="870" font-size="16" class="fg" font-weight="400" text-anchor="start">Read: 10</text>
<rect x="20" y="882" width="13" height="13" rx="3" class="light"/>
<text x="44" y="895" font-size="16" class="fg" font-weight="400" text-anchor="start">Unexplained: 8</text>
<text x="20" y="935" font-size="16" class="fg" font-weight="600" text-anchor="start">Longer, width at least 4 (n=150)</text>
<rect x="20" y="962" width="34.13333333333333" height="16" rx="3" class="blue"/>
<rect x="54.13333333333333" y="962" width="32.0" height="16" rx="3" class="amber"/>
<rect x="86.13333333333333" y="962" width="25.6" height="16" rx="3" class="grey"/>
<rect x="111.73333333333332" y="962" width="228.26666666666668" height="16" rx="3" class="light"/>
<rect x="20" y="992" width="13" height="13" rx="3" class="blue"/>
<text x="44" y="1005" font-size="16" class="fg" font-weight="400" text-anchor="start">Resample-tested: 16</text>
<rect x="20" y="1017" width="13" height="13" rx="3" class="amber"/>
<text x="44" y="1030" font-size="16" class="fg" font-weight="400" text-anchor="start">Optimal-only: 15</text>
<rect x="20" y="1042" width="13" height="13" rx="3" class="grey"/>
<text x="44" y="1055" font-size="16" class="fg" font-weight="400" text-anchor="start">Read: 12</text>
<rect x="20" y="1067" width="13" height="13" rx="3" class="light"/>
<text x="44" y="1080" font-size="16" class="fg" font-weight="400" text-anchor="start">Unexplained: 107</text>
<text x="20" y="1120" font-size="16" class="fg" font-weight="400" text-anchor="start">117 resample-tested; 15</text>
<text x="20" y="1143" font-size="16" class="fg" font-weight="400" text-anchor="start">optimal-only; 33 read; 115</text>
<text x="20" y="1166" font-size="16" class="fg" font-weight="400" text-anchor="start">unexplained.</text>
<text x="20" y="1198" font-size="16" class="fg" font-weight="400" text-anchor="start">The 15 optimal-only certificates</text>
<text x="20" y="1221" font-size="16" class="fg" font-weight="400" text-anchor="start">fail resampling. Resample-tested</text>
<text x="20" y="1244" font-size="16" class="fg" font-weight="400" text-anchor="start">forms retain their recorded flags.</text>
<text x="20" y="1276" font-size="16" class="fg" font-weight="400" text-anchor="start">All binary models include weak and</text>
<text x="20" y="1299" font-size="16" class="fg" font-weight="400" text-anchor="start">constant predictors. Empirical</text>
<text x="20" y="1322" font-size="16" class="fg" font-weight="400" text-anchor="start">certificates do not prove exact</text>
<text x="20" y="1345" font-size="16" class="fg" font-weight="400" text-anchor="start">task algorithms or longer-length</text>
<text x="20" y="1368" font-size="16" class="fg" font-weight="400" text-anchor="start">generalisation.</text>
</svg>
