<svg xmlns="http://www.w3.org/2000/svg" width="760" height="407" viewBox="0 0 760 407" role="img" aria-labelledby="title desc">
<title id="title">More search steps did not mean a larger map</title>
<desc id="desc">Final scratchpads; 10 seeds per cell; 16 mazes per sampled distance; teacher-forced. Intervals copy the source-reported distance-average or grid-size ranges across seeds. New square tokens on 8x8 grids were untrained. Greedy checks covered only distance 2. PART: partial verification coverage (complement in 3 seeds). No TRAIN form accepted. Values: 6x6, distance 11-16: PART: frozen routing 1.0, TRAIN: all weights learned .66–1.0; 6x6, distance 17-20: PART: frozen routing 1.0, TRAIN: all weights learned .41–.78; 8x8, distance 0-10: PART: frozen routing 1.0, TRAIN: all weights learned 0–.09.</desc>
