<svg xmlns="http://www.w3.org/2000/svg" width="540" height="937.5" viewBox="0 0 360 625" role="img" aria-labelledby="title desc">
<title id="title">Median formula size versus network size</title>
<desc id="desc">Width 16 at length 10: 274 independent form coefficients versus 288 network parameters. Width 32 at length 10: 1056 versus 1088. These forms are not compression claims. Finite-sample fidelity is not all-domain exactness. Source: atlas entry (research report), https://github.com/jc1122/mechanistic-interpretability-circuit-atlas/blob/main/entries/algzoo-median.md.</desc>
<metadata>CC BY 4.0. Compact redraw; recorded values unchanged. Original figure metadata retained.</metadata>
<style>text{font-family:system-ui,sans-serif}.fg{fill:#172b3a}.bg{fill:#ffffff}.panel{fill:#f0f4f8;stroke:#63758b;stroke-width:1.5}.trained{fill:#fff0ba;stroke:#63758b;stroke-width:1.5}.ink{fill:#172b3a}.grid{stroke:#7d8c98}.track{fill:#e1e6eb}.blue{fill:#176b9b}.amber{fill:#a05a00}.grey{fill:#697681}.light{fill:#e1e6eb;stroke:#63758b}.blue-line{stroke:#176b9b}.amber-line{stroke:#a05a00}.grey-line{stroke:#697681}
@media(prefers-color-scheme:dark){.fg{fill:#f0f6fc}.bg{fill:#161b22}.panel{fill:#263746;stroke:#9bacc0}.trained{stroke:#e3b341}.grid{stroke:#8b949e}.track{fill:#303c49}.blue{fill:#58a6ff}.amber{fill:#e3b341}.grey{fill:#a0adba}.light{fill:#303c49;stroke:#9bacc0}.blue-line{stroke:#58a6ff}.amber-line{stroke:#e3b341}.grey-line{stroke:#a0adba}}</style>
<rect width="360" height="625" rx="8" class="bg"/>
<text x="20" y="24" font-size="18" class="fg" font-weight="600" text-anchor="start">Median: explanation size</text>
<text x="20" y="59" font-size="16" class="fg" font-weight="400" text-anchor="start">Length 10; independent form</text>
<text x="20" y="82" font-size="16" class="fg" font-weight="400" text-anchor="start">coefficients and network</text>
<text x="20" y="105" font-size="16" class="fg" font-weight="400" text-anchor="start">parameters</text>
<text x="20" y="137" font-size="16" class="fg" font-weight="600" text-anchor="start">Width 16</text>
<text x="20" y="169" font-size="16" class="fg" font-weight="400" text-anchor="start">Form coefficients: 274</text>
<rect x="20" y="196" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="196" width="80.58823529411765" height="12" rx="3" class="blue"/>
<text x="20" y="232" font-size="16" class="fg" font-weight="400" text-anchor="start">Network parameters: 288</text>
<rect x="20" y="259" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="259" width="84.70588235294117" height="12" rx="3" class="grey"/>
<text x="20" y="295" font-size="16" class="fg" font-weight="600" text-anchor="start">Width 32</text>
<text x="20" y="327" font-size="16" class="fg" font-weight="400" text-anchor="start">Form coefficients: 1056</text>
<rect x="20" y="354" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="354" width="310.5882352941176" height="12" rx="3" class="blue"/>
<text x="20" y="390" font-size="16" class="fg" font-weight="400" text-anchor="start">Network parameters: 1088</text>
<rect x="20" y="417" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="417" width="320.0" height="12" rx="3" class="grey"/>
<text x="20" y="453" font-size="16" class="fg" font-weight="400" text-anchor="start">Common bar scale; no compression</text>
<text x="20" y="476" font-size="16" class="fg" font-weight="400" text-anchor="start">claim. The formulas also describe</text>
<text x="20" y="499" font-size="16" class="fg" font-weight="400" text-anchor="start">median errors.</text>
<text x="20" y="531" font-size="16" class="fg" font-weight="400" text-anchor="start">Sampled tests, not all-domain</text>
<text x="20" y="554" font-size="16" class="fg" font-weight="400" text-anchor="start">exactness. Fixed signs and offsets</text>
<text x="20" y="577" font-size="16" class="fg" font-weight="400" text-anchor="start">are listed in the entry.</text>
