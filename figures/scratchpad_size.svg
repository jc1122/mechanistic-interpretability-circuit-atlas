<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--ink)" stroke-width="1.6"/></marker></defs>
<rect x="0" y="0" width="540" height="696" rx="0" class="bg"/>
<text x="18" y="40" font-size="30" font-weight="650" class="" text-anchor="start">Writing the working can</text>
<text x="18" y="70" font-size="30" font-weight="650" class="" text-anchor="start">shrink a circuit</text>
<text x="18" y="108" font-size="25" font-weight="400" class="muted" text-anchor="start">Hand-built 8-bit long division</text>
<rect x="18" y="130" width="504" height="193" rx="12" class="card"/>
<text x="36" y="166" font-size="27" font-weight="650" class="" text-anchor="start">Answer only</text>
<text x="36" y="201" font-size="24" font-weight="400" class="" text-anchor="start">Keep the comparisons inside the network</text>
<rect x="180" y="217" width="220" height="51" rx="8" class="given"/>
<text x="290" y="250" font-size="24" font-weight="600" class="blue" text-anchor="middle">comparisons</text>
<text x="36" y="250" font-size="24" font-weight="400" class="" text-anchor="start">input</text>
<path d="M 100 243 H 170" class="flow"/>
<path d="M 410 243 H 430" class="flow"/>
<text x="475" y="250" font-size="24" font-weight="400" class="" text-anchor="middle">answer</text>
<text x="290" y="304" font-size="27" font-weight="650" class="blue" text-anchor="middle">186 neurons</text>
<rect x="18" y="345" width="504" height="291" rx="12" class="card"/>
<text x="36" y="381" font-size="27" font-weight="650" class="" text-anchor="start">Write each step</text>
<text x="36" y="414" font-size="24" font-weight="400" class="" text-anchor="start">Read the numbers and written remainder</text>
<rect x="169" y="439" width="324" height="75" rx="8" class="given"/>
<text x="331" y="469" font-size="24" font-weight="600" class="blue" text-anchor="middle">compare, then subtract</text>
<text x="331" y="499" font-size="27" font-weight="650" class="blue" text-anchor="middle">14 neurons</text>
<path d="M 331 518 V 539" class="flow"/>
<rect x="169" y="541" width="324" height="84" rx="4" class="paper"/>
<text x="331" y="573" font-size="24" font-weight="400" class="" text-anchor="middle">write the next bit</text>
<text x="331" y="605" font-size="24" font-weight="400" class="" text-anchor="middle">and remainder</text>
<path d="M 164 583 H 137 V 477 H 160" class="flow repeat"/>
<text x="91" y="524" font-size="24" font-weight="600" class="" text-anchor="middle">reuse</text>
<text x="18" y="676" font-size="24" font-weight="400" class="muted" text-anchor="start">Design counts, not trained-network sizes.</text>
</svg>
