<svg xmlns="http://www.w3.org/2000/svg" width="540" height="696" viewBox="0 0 540 696" role="img" aria-labelledby="title desc">
<title id="title">Writing the working can shrink a circuit</title>
<desc id="desc">A simplified picture of hand-built 8-bit long division. Answer only uses many internal comparisons, with 186 used neurons. A scratchpad writes each step so the same compare-and-subtract circuit reads the written state repeatedly, with 14 used neurons. The companion table also records 8-bit long-hand square root: 46 versus 20 neurons, and 6-bit multiplication: 14 versus 7 attention heads. These compare named hand-built designs, not trained networks, seed averages or interchangeable size units. Arrows show information flow, not measured counts of connections.</desc>
