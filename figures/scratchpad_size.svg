.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:2}
.given{fill:var(--bluefill);stroke:var(--blue);stroke-width:2;stroke-dasharray:7 5}
.learned{fill:var(--amberfill);stroke:var(--amber);stroke-width:2.5}
