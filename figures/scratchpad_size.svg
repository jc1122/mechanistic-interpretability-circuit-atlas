<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1119.0" viewBox="0 0 360 746" role="img" aria-labelledby="title desc">
<title id="title">Hand-built circuit sizes with and without a scratchpad</title>
<desc id="desc">Long division: answer only 186 MLP neurons, with scratchpad 14. Square root: answer only 46 MLP neurons, with scratchpad 20. Six-bit multiplication: answer only 14 attention heads, with scratchpad 7. Neurons and heads have separate scales. These are hand-built designs, not trained-network sizes.</desc>
