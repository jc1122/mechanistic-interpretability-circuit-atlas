<svg xmlns="http://www.w3.org/2000/svg" width="640" height="696" viewBox="0 0 640 696" role="img" aria-labelledby="title desc">
<title id="title">Written steps reuse a smaller circuit</title>
<desc id="desc">Hand-built 8-bit long division, illustrated by 7 divided by 2, quotient 3 and remainder 1. The answer-only design uses 186 neurons. Its parallel threshold bank tests multiples of the divisor: 7 ≥ 2, 7 ≥ 4 and 7 ≥ 6 are true (1); the test 7 ≥ 8 is false (0). The drawing shows four selected tests, not the full bank or bit wiring. The written-step design uses 14 neurons: read the old remainder 1 and next input bit 1 to form 2 × 1 + 1 = 3, compare the working value 3 with divisor 2, subtract 2, and write decision bit 1 and remainder 1. The return path reads that remainder for the next step. All weights in both designs are fixed by formulas. These are named design counts, not trained-network sizes, averages or interchangeable units. Table 1 also retains 8-bit square root: 46 versus 20 neurons, and 6-bit multiplication: 14 versus 7 attention heads.</desc>
