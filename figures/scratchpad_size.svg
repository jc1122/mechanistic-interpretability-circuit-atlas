<rect width="360" height="746" rx="8" class="bg"/>
<text x="20" y="24" font-size="18" class="fg" font-weight="600" text-anchor="start">Hand-built circuit sizes</text>
<text x="20" y="59" font-size="16" class="fg" font-weight="400" text-anchor="start">Separate scales for neurons and</text>
<text x="20" y="82" font-size="16" class="fg" font-weight="400" text-anchor="start">heads; these are designed</text>
<text x="20" y="105" font-size="16" class="fg" font-weight="400" text-anchor="start">circuits, not trained-network</text>
<text x="20" y="128" font-size="16" class="fg" font-weight="400" text-anchor="start">sizes.</text>
<text x="20" y="160" font-size="16" class="fg" font-weight="600" text-anchor="start">Long division</text>
<text x="20" y="192" font-size="16" class="fg" font-weight="400" text-anchor="start">MLP neurons</text>
<text x="20" y="224" font-size="16" class="fg" font-weight="400" text-anchor="start">Answer only: 186</text>
<rect x="20" y="251" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="251" width="320.0" height="12" rx="3" class="amber"/>
<text x="20" y="287" font-size="16" class="fg" font-weight="400" text-anchor="start">With scratchpad: 14</text>
<rect x="20" y="314" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="314" width="24.086021505376344" height="12" rx="3" class="blue"/>
<text x="20" y="350" font-size="16" class="fg" font-weight="600" text-anchor="start">Square root</text>
<text x="20" y="382" font-size="16" class="fg" font-weight="400" text-anchor="start">MLP neurons</text>
<text x="20" y="414" font-size="16" class="fg" font-weight="400" text-anchor="start">Answer only: 46</text>
<rect x="20" y="441" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="441" width="79.13978494623656" height="12" rx="3" class="amber"/>
<text x="20" y="477" font-size="16" class="fg" font-weight="400" text-anchor="start">With scratchpad: 20</text>
<rect x="20" y="504" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="504" width="34.40860215053763" height="12" rx="3" class="blue"/>
