<text x="20" y="59" font-size="16" class="fg" font-weight="400" text-anchor="start">Answer-only screening arm</text>
<rect x="20" y="85" width="320" height="74" rx="3" class="panel"/>
<text x="34" y="114" font-size="16" class="fg" font-weight="600" text-anchor="start">Operand coefficients</text>
<text x="34" y="140" font-size="16" class="fg" font-weight="400" text-anchor="start">input</text>
<path d="M180,160 L180,184" class="grid" fill="none" stroke-width="2"/>
<path d="M175,179 L180,185 L185,179" class="grid" fill="none" stroke-width="2"/>
<rect x="20" y="191" width="320" height="74" rx="3" class="panel"/>
<text x="34" y="220" font-size="16" class="fg" font-weight="600" text-anchor="start">Signed-product gates</text>
<text x="34" y="246" font-size="16" class="fg" font-weight="400" text-anchor="start">hand-built and frozen</text>
<path d="M180,266 L180,290" class="grid" fill="none" stroke-width="2"/>
<path d="M175,285 L180,291 L185,285" class="grid" fill="none" stroke-width="2"/>
<rect x="20" y="297" width="320" height="74" rx="3" class="trained"/>
<text x="34" y="326" font-size="16" class="ink" font-weight="600" text-anchor="start">Sum / output weights</text>
<text x="34" y="352" font-size="16" class="ink" font-weight="400" text-anchor="start">trained</text>
<text x="20" y="390" font-size="16" class="fg" font-weight="600" text-anchor="start">3/3 screening seeds: .998-.999</text>
<text x="20" y="413" font-size="16" class="fg" font-weight="600" text-anchor="start">whole-output exact match</text>
<text x="20" y="445" font-size="16" class="fg" font-weight="400" text-anchor="start">1000 held-out pairs per seed</text>
<text x="20" y="477" font-size="16" class="fg" font-weight="400" text-anchor="start">No seed reached 1.0.</text>
<text x="20" y="509" font-size="16" class="fg" font-weight="400" text-anchor="start">No verified learned mechanism.</text>
