<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1330.5" viewBox="0 0 360 887" role="img" aria-labelledby="title desc">
<title id="title">Multiplication success by base and digit order</title>
<desc id="desc">Binary: units first 17/20, largest place first 0/20. Decimal: 20/20 versus 1/20. Hexadecimal: 4/20 versus 0/20. Four data mixes, 5 seeds each; no percentages computed. Running-sum scratchpads passed in 18/18 seeds at original width. Different output lengths and mixes prevent a format-only causal conclusion. Source: atlas entry (research report), https://github.com/jc1122/mechanistic-interpretability-circuit-atlas/blob/main/entries/multiplication-base-order.md.</desc>
<metadata>CC BY 4.0. Compact redraw; recorded values unchanged. Original figure metadata retained.</metadata>
<style>text{font-family:system-ui,sans-serif}.fg{fill:#172b3a}.bg{fill:#ffffff}.panel{fill:#f0f4f8;stroke:#63758b;stroke-width:1.5}.trained{fill:#fff0ba;stroke:#63758b;stroke-width:1.5}.ink{fill:#172b3a}.grid{stroke:#7d8c98}.track{fill:#e1e6eb}.blue{fill:#176b9b}.amber{fill:#a05a00}.grey{fill:#697681}.light{fill:#e1e6eb;stroke:#63758b}.blue-line{stroke:#176b9b}.amber-line{stroke:#a05a00}.grey-line{stroke:#697681}
@media(prefers-color-scheme:dark){.fg{fill:#f0f6fc}.bg{fill:#161b22}.panel{fill:#263746;stroke:#9bacc0}.trained{stroke:#e3b341}.grid{stroke:#8b949e}.track{fill:#303c49}.blue{fill:#58a6ff}.amber{fill:#e3b341}.grey{fill:#a0adba}.light{fill:#303c49;stroke:#9bacc0}.blue-line{stroke:#58a6ff}.amber-line{stroke:#e3b341}.grey-line{stroke:#a0adba}}</style>
<rect width="360" height="887" rx="8" class="bg"/>
<text x="20" y="24" font-size="18" class="fg" font-weight="600" text-anchor="start">Multiplication: base and digit</text>
<text x="20" y="50" font-size="18" class="fg" font-weight="600" text-anchor="start">order</text>
<text x="20" y="85" font-size="16" class="fg" font-weight="400" text-anchor="start">Original-width answer-only</text>
<text x="20" y="108" font-size="16" class="fg" font-weight="400" text-anchor="start">screens; four data mixes, 5 seeds</text>
<text x="20" y="131" font-size="16" class="fg" font-weight="400" text-anchor="start">each: 20 seeds per base and order.</text>
<text x="20" y="163" font-size="16" class="fg" font-weight="400" text-anchor="start">Success: best whole-output exact</text>
<text x="20" y="186" font-size="16" class="fg" font-weight="400" text-anchor="start">match &gt;= .99 on 2000 held-out</text>
<text x="20" y="209" font-size="16" class="fg" font-weight="400" text-anchor="start">pairs.</text>
<text x="20" y="241" font-size="16" class="fg" font-weight="600" text-anchor="start">Binary</text>
<text x="20" y="273" font-size="16" class="fg" font-weight="400" text-anchor="start">Units first (LSB): 17/20</text>
<rect x="20" y="300" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="300" width="272.0" height="12" rx="3" class="blue"/>
<text x="20" y="336" font-size="16" class="fg" font-weight="400" text-anchor="start">Largest place first (MSB): 0/20</text>
<rect x="20" y="363" width="320" height="12" rx="3" class="track"/>
<text x="20" y="399" font-size="16" class="fg" font-weight="600" text-anchor="start">Decimal</text>
<text x="20" y="431" font-size="16" class="fg" font-weight="400" text-anchor="start">Units first (LSB): 20/20</text>
<rect x="20" y="458" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="458" width="320.0" height="12" rx="3" class="blue"/>
<text x="20" y="494" font-size="16" class="fg" font-weight="400" text-anchor="start">Largest place first (MSB): 1/20</text>
<rect x="20" y="521" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="521" width="16.0" height="12" rx="3" class="grey"/>
<text x="20" y="557" font-size="16" class="fg" font-weight="600" text-anchor="start">Hexadecimal</text>
<text x="20" y="589" font-size="16" class="fg" font-weight="400" text-anchor="start">Units first (LSB): 4/20</text>
<rect x="20" y="616" width="320" height="12" rx="3" class="track"/>
<rect x="20" y="616" width="64.0" height="12" rx="3" class="blue"/>
<text x="20" y="652" font-size="16" class="fg" font-weight="400" text-anchor="start">Largest place first (MSB): 0/20</text>
<rect x="20" y="679" width="320" height="12" rx="3" class="track"/>
<text x="20" y="715" font-size="16" class="fg" font-weight="400" text-anchor="start">Running-sum scratchpads: 18/18 at</text>
<text x="20" y="738" font-size="16" class="fg" font-weight="400" text-anchor="start">the original width.</text>
<text x="20" y="770" font-size="16" class="fg" font-weight="400" text-anchor="start">Fixed operands below 256; no</text>
<text x="20" y="793" font-size="16" class="fg" font-weight="400" text-anchor="start">reliable length generalisation.</text>
<text x="20" y="816" font-size="16" class="fg" font-weight="400" text-anchor="start">Not a compute-matched format-only</text>
<text x="20" y="839" font-size="16" class="fg" font-weight="400" text-anchor="start">causal test.</text>
</svg>
