<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="title desc">
<title id="title">Multiplication success by base and digit order</title>
<desc id="desc">Binary: units first 17/20, largest place first 0/20. Decimal: 20/20 versus 1/20. Hexadecimal: 4/20 versus 0/20. Four data mixes, 5 seeds each; no percentages computed. Running-sum scratchpads passed in 18/18 seeds at original width. Different output lengths and mixes prevent a format-only causal conclusion. Source: atlas entry (research report), https://github.com/jc1122/mechanistic-interpretability-circuit-atlas/blob/main/entries/multiplication-base-order.md.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="28" y="35" font-size="23" fill="#0f172a" font-weight="bold">Digit order changes multiplication learning</text>
<text x="28" y="66" font-size="15" fill="#0f172a" font-weight="normal">Original-width answer-only screens; 20 seeds per base and order</text>
<text x="28" y="92" font-size="14" fill="#64748b" font-weight="normal">Success: best whole-output exact match &gt;= .99 on 2000 held-out pairs</text>
<rect x="28" y="111" width="16.000" height="16" rx="3" fill="#2563eb"/>
<text x="52" y="125" font-size="15" fill="#0f172a" font-weight="normal">Units first (LSB)</text>
<rect x="245" y="111" width="16.000" height="16" rx="3" fill="#64748b"/>
<text x="269" y="125" font-size="15" fill="#0f172a" font-weight="normal">Largest place first (MSB)</text>
<text x="28" y="183" font-size="17" fill="#0f172a" font-weight="bold">Binary</text>
<rect x="185" y="155" width="410.000" height="22" rx="3" fill="#e2e8f0"/>
<rect x="185" y="155" width="348.500" height="22" rx="3" fill="#2563eb"/>
<text x="620" y="172" font-size="16" fill="#0f172a" font-weight="normal">17/20</text>
<rect x="185" y="184" width="410.000" height="22" rx="3" fill="#e2e8f0"/>
<rect x="185" y="184" width="0.000" height="22" rx="3" fill="#64748b"/>
<text x="620" y="201" font-size="16" fill="#0f172a" font-weight="normal">0/20</text>
<text x="28" y="265" font-size="17" fill="#0f172a" font-weight="bold">Decimal</text>
<rect x="185" y="237" width="410.000" height="22" rx="3" fill="#e2e8f0"/>
<rect x="185" y="237" width="410.000" height="22" rx="3" fill="#2563eb"/>
<text x="620" y="254" font-size="16" fill="#0f172a" font-weight="normal">20/20</text>
<rect x="185" y="266" width="410.000" height="22" rx="3" fill="#e2e8f0"/>
<rect x="185" y="266" width="20.500" height="22" rx="3" fill="#64748b"/>
<text x="620" y="283" font-size="16" fill="#0f172a" font-weight="normal">1/20</text>
<text x="28" y="347" font-size="17" fill="#0f172a" font-weight="bold">Hexadecimal</text>
<rect x="185" y="319" width="410.000" height="22" rx="3" fill="#e2e8f0"/>
<rect x="185" y="319" width="82.000" height="22" rx="3" fill="#2563eb"/>
<text x="620" y="336" font-size="16" fill="#0f172a" font-weight="normal">4/20</text>
<rect x="185" y="348" width="410.000" height="22" rx="3" fill="#e2e8f0"/>
<rect x="185" y="348" width="0.000" height="22" rx="3" fill="#64748b"/>
<text x="620" y="365" font-size="16" fill="#0f172a" font-weight="normal">0/20</text>
<text x="28" y="435" font-size="16" fill="#0f172a" font-weight="normal">Running-sum scratchpads: 18/18 at the original width.</text>
<text x="28" y="461" font-size="14" fill="#64748b" font-weight="normal">Fixed operand range below 256; no reliable length generalisation.</text>
<text x="28" y="485" font-size="14" fill="#64748b" font-weight="normal">The format comparison is not a compute-matched causal test.</text>
</g>
</svg>
