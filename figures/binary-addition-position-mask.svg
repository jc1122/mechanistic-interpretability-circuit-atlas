<text x="20" y="615" font-size="16" class="fg" font-weight="400" text-anchor="start">Whole-output exact accuracy</text>
<text x="20" y="647" font-size="16" class="fg" font-weight="400" text-anchor="start">Copied seed ranges; 1,000 random</text>
<text x="20" y="670" font-size="16" class="fg" font-weight="400" text-anchor="start">pairs per length; fp32.</text>
