<svg xmlns="http://www.w3.org/2000/svg" width="640" height="693.3333333333334" viewBox="0 0 360 390" role="img" aria-labelledby="title desc">
<title id="title">Blocking position cues repairs longer column-sum outputs</title>
<desc id="desc">Blocking position cues repairs longer column-sum outputs. Hiding position inputs restores longer sums. Frozen-routing binary addition; column-sum scratchpad; 10 seeds per setting. Intervals are copied seed ranges on 1,000 random pairs per length (fp32). The position mask repairs this format; carry-token stages still have length errors. Values: 7-bit operands: Original trained stage .17–.20, Position inputs masked during training 1.00; 8-bit operands: Original trained stage .01–.02, Position inputs masked during training 1.00; 12-bit operands: Original trained stage 0, Position inputs masked during training 1.00.</desc>
<ns0:metadata xmlns:ns0="http://www.w3.org/2000/svg">CC BY 4.0. Compact redraw; recorded values unchanged. Original figure metadata retained.</ns0:metadata>

