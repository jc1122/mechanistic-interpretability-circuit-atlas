<svg xmlns="http://www.w3.org/2000/svg" width="640" height="412" viewBox="0 0 640 412" role="img" aria-labelledby="title desc">
<title id="title">Training groups supplied counts</title>
<desc id="desc">The fixed counter reads a a b a a a b a a: seven a&#x27;s. Its count-7 indicator is on (1); its count-2 indicator is off (0). The worked arithmetic 7 = 5 + 2 explains the requested remainder after division by five. The indicator paths feed a trained lookup that groups counts 2 and 7 under answer 2. This depicts the main count-code path, not individual neurons or all supplied features. Only the answer stage was trained. The formula is Partial, supported by substitution; circuitry outside it was not resampled. The lookup largely ignores line length; unseen count values were not tested.</desc>

<metadata>CC BY 4.0. First-party explanatory redraw; no new experimental measurements. Sources: entries/count-mod-5.md (atlas research entry).</metadata>
