<svg xmlns="http://www.w3.org/2000/svg" width="540" height="290" viewBox="0 0 540 290" role="img" aria-labelledby="title desc">
<title id="title">Different counts, the same answer</title>
<desc id="desc">A frozen hand-built counter reads the example a a b a a a b a a and supplies count 7. Only the answer stage is trained. Its lookup pools counts with the same remainder after division by five, such as 2 and 7, and answers 2. The lookup largely ignores line length. The formula is partial, supported by substitution; circuitry outside it was not resampled. Unseen count values were not tested.</desc>

<metadata>CC BY 4.0. First-party explanatory redraw; no new experimental measurements. Sources: entries/count-mod-5.md; entries/long-division-square-root.md; entries/multiplication.md.</metadata>
