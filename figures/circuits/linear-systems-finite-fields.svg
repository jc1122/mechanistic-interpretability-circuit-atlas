<text x="370" y="328" class="detail" text-anchor="start">Replaces last block</text>
</g>
<path class="arrow" d="M 484 588 L 484 528" marker-end="url(#tip)"/>
<text x="360" y="574" class="value-label" text-anchor="start">from system</text>
<path class="arrow" d="M 484 452 L 484 336" marker-end="url(#tip)"/>
<text x="360" y="392" class="value-label" text-anchor="start">old 3; product 2</text>
<path class="arrow uncertain" d="M 484 260 L 484 224 L 320 224" marker-end="url(#tip)"/>
<text x="360" y="214" class="value-label" text-anchor="start">test target 1</text>
<g class="input">
<rect class="node" x="24" y="588" width="592" height="76" rx="10"/>
<text x="42" y="622" class="node-title" text-anchor="start">System: x+2y=3; y=1</text>
<text x="42" y="656" class="detail" text-anchor="start">Modulo 5; correct product 2 supplied</text>
</g>
</svg>
