<circle class="junction" cx="320" cy="224" r="4"/>
<text x="280" y="392" class="value-label" text-anchor="end">unknown operands</text>
<text x="280" y="214" class="value-label" text-anchor="end">token target 1</text>
<g class="trained uncertain">
<rect class="node" x="24" y="260" width="264" height="76" rx="10"/>
<text x="42" y="294" class="node-title" text-anchor="start">Native writer</text>
<text x="42" y="328" class="detail" text-anchor="start">Operands unknown</text>
</g>
<path class="arrow" d="M 320 550 L 258 550 L 258 528" marker-end="url(#tip)"/>
<path class="arrow" d="M 258 452 L 258 430 L 320 430" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="550" r="4"/>
<circle class="junction" cx="320" cy="430" r="4"/>
<g class="trained">
<rect class="node" x="24" y="452" width="264" height="76" rx="10"/>
<text x="42" y="486" class="node-title" text-anchor="start">Neurons + heads</text>
<text x="42" y="520" class="detail" text-anchor="start">Early + late context</text>
</g>
<g class="input">
<rect class="node" x="352" y="452" width="264" height="76" rx="10"/>
<text x="370" y="486" class="node-title" text-anchor="start">Reference labels</text>
<text x="370" y="520" class="detail" text-anchor="start">From system, not net</text>
</g>
<g class="process uncertain">
<rect class="node" x="352" y="260" width="264" height="76" rx="10"/>
