<svg xmlns="http://www.w3.org/2000/svg" width="640" height="704" viewBox="0 0 640 704" role="img" aria-labelledby="title desc">
<title id="title">Fixed number codes feed a fitted wave-like answer vote</title>
<desc id="desc">All ten menu-fed MLPs, with no HAND adder. Frozen readers branch off the short residual stream and write nominal x/100,y/100; parallel frozen category and passed-threshold features then feed one external feed-forward stage, not extra transformer residual layers. Its repeating hidden responses and outgoing answer votes are combined in the dashed fitted box. Example SUM:58 2, ANSWER: has nominal reader codes .58,.02, categories 58,2, passed thresholds 1..58 and 1..2, remainder target 1 after division by 59. These are task encodings, not measured trained activations. The fitted rule is Partial, changes some native answers, and has no complement test; the native task remains unsolved.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
.trained .node { fill:var(--amber-bg); stroke:var(--amber); }
.register .node { fill:var(--blue-bg); stroke:var(--blue); }
.register-line { stroke:var(--blue); stroke-width:3; }
.unused .node { fill:var(--idle); }
.uncertain .node, .uncertain.arrow { stroke-dasharray:8 6; }
.node-title { font-size:28px; font-weight:650; }
.detail { font-size:24px; }
.tag { font-size:22px; font-weight:600; fill:var(--muted); }
.heading { font-size:30px; font-weight:700; }
.note { font-size:24px; fill:var(--muted); }
.arrow { fill:none; stroke:var(--line); stroke-width:2.5; }
.arrowhead { fill:var(--line); }
.arrow-label { font-size:24px; fill:var(--muted); paint-order:stroke;
  stroke:var(--bg); stroke-width:8; stroke-linejoin:round; }
.example-bg { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.bus-band { fill:none; stroke:var(--line); stroke-width:10; opacity:.14; }
.bus-line { fill:none; stroke:var(--line); stroke-width:2.5; }
.junction { fill:var(--line); }
.lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 7; }
.value-label { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:24px; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:8; stroke-linejoin:round; }
.legend-text { font-size:22px; fill:var(--muted); }
.legend-frozen { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.legend-trained { fill:var(--amber-bg); stroke:var(--amber); stroke-width:2; }
.legend-unverified { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:5 4; }
.tag,.legend-text {font-size:24px;} text {line-height:1.1;}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" width="640" height="704"/>
<text x="24" y="36" class="heading" text-anchor="start">Fixed number codes feed</text>
<text x="24" y="80" class="heading" text-anchor="start">a fitted wave-like answer vote</text>
<rect class="legend-frozen" x="24" y="98" width="24" height="20" rx="3"/>
<text x="58" y="116" class="legend-text" text-anchor="start">frozen</text>
<rect class="legend-trained" x="214" y="98" width="24" height="20" rx="3"/>
<text x="248" y="116" class="legend-text" text-anchor="start">trained</text>
<rect class="legend-unverified" x="404" y="98" width="24" height="20" rx="3"/>
<text x="438" y="116" class="legend-text" text-anchor="start">not verified</text>
<text x="24" y="690" class="note" text-anchor="start">Task example, not a measurement.</text>
<path class="bus-line" d="M 320 588 V 458" marker-end="url(#tip)"/>
<text x="352" y="580" class="note" text-anchor="start">residual stream</text>
<g class="output">
<rect class="node" x="24" y="128" width="592" height="56" rx="10"/>
<text x="42" y="166" class="node-title" text-anchor="start">Remainder after division by 59</text>
</g>
<g class="trained uncertain">
<rect class="node" x="24" y="244" width="592" height="76" rx="10"/>
<text x="42" y="278" class="node-title" text-anchor="start">Repeating responses vote for a sum</text>
<text x="42" y="312" class="detail" text-anchor="start">Fitted hidden responses and outgoing votes</text>
</g>
<path class="arrow uncertain" d="M 320 244 L 320 184" marker-end="url(#tip)"/>
<text x="352" y="216" class="value-label" text-anchor="start">sum target = 1</text>
<g class="process">
<rect class="node" x="24" y="362" width="264" height="76" rx="10"/>
<text x="42" y="396" class="node-title" text-anchor="start">Number labels</text>
<text x="42" y="430" class="detail" text-anchor="start">One label per value</text>
</g>
<g class="process">
<rect class="node" x="352" y="362" width="264" height="76" rx="10"/>
<text x="370" y="396" class="node-title" text-anchor="start">Passed steps</text>
<text x="370" y="430" class="detail" text-anchor="start">Threshold flags</text>
</g>
<path class="arrow uncertain" d="M 148 362 L 148 320" marker-end="url(#tip)"/>
<text x="32" y="354" class="value-label" text-anchor="start">labels 58,2</text>
<path class="arrow uncertain" d="M 484 362 L 484 320" marker-end="url(#tip)"/>
<text x="360" y="354" class="value-label" text-anchor="start">flags 1..58,1..2</text>
<path class="arrow" d="M 320 458 L 258 458 L 258 438" marker-end="url(#tip)"/>
<path class="arrow" d="M 320 458 L 382 458 L 382 438" marker-end="url(#tip)"/>
<path class="arrow" d="M 320 584 L 258 584 L 258 570" marker-end="url(#tip)"/>
<path class="arrow" d="M 258 494 L 258 480 L 320 480" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="584" r="4"/>
<circle class="junction" cx="320" cy="480" r="4"/>
<text x="280" y="470" class="value-label" text-anchor="end">codes .58,.02</text>
<g class="process">
<rect class="node" x="24" y="494" width="264" height="76" rx="10"/>
<text x="42" y="528" class="node-title" text-anchor="start">Read numbers</text>
<text x="42" y="562" class="detail" text-anchor="start">Frozen; no adder</text>
</g>
<g class="input">
<rect class="node" x="24" y="588" width="592" height="76" rx="10"/>
<text x="42" y="622" class="node-title" text-anchor="start">Input: SUM: 58 2</text>
<text x="42" y="656" class="detail" text-anchor="start">ANSWER:</text>
</g>
</svg>
