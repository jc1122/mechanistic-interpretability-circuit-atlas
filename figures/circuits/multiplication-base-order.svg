<svg xmlns="http://www.w3.org/2000/svg" width="640" height="704" viewBox="0 0 640 704" role="img" aria-labelledby="title desc">
<title id="title">Only outgoing digit votes change; native arithmetic stays</title>
<desc id="desc">TRAIN scratchpad outgoing-map substitute, with no HAND. One thin residual stream keeps other native writes while a final-neuron-block branch reads native context. Native neuron responses stay unchanged, and feed a dashed fitted outgoing digit-score map before writing back. These two boxes are within the same final block, not separate residual layers; no hidden-neuron response is falsely written onto the bus. The substitute does not compute sums or carries, and the complement is untested. Decimal 007*003= has next scratch digit target 1 in the units-first running sum 12000;, eventual final answer 00021. Numeric native activations are not invented. Partial, passing-snapshot scope only, no established length transfer.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
.trained .node { fill:var(--amber-bg); stroke:var(--amber); }
.register .node { fill:var(--blue-bg); stroke:var(--blue); }
.register-line { stroke:var(--blue); stroke-width:3; }
.unused .node { fill:var(--idle); }
.uncertain .node, .uncertain.arrow { stroke-dasharray:8 6; }
.node-title { font-size:28px; font-weight:650; }
.detail { font-size:24px; }
.tag { font-size:22px; font-weight:600; fill:var(--muted); }
.heading { font-size:30px; font-weight:700; }
.note { font-size:24px; fill:var(--muted); }
.arrow { fill:none; stroke:var(--line); stroke-width:2.5; }
.arrowhead { fill:var(--line); }
.arrow-label { font-size:24px; fill:var(--muted); paint-order:stroke;
  stroke:var(--bg); stroke-width:8; stroke-linejoin:round; }
.example-bg { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.bus-band { fill:none; stroke:var(--line); stroke-width:10; opacity:.14; }
.bus-line { fill:none; stroke:var(--line); stroke-width:2.5; }
.junction { fill:var(--line); }
.lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 7; }
.value-label { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:24px; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:8; stroke-linejoin:round; }
.legend-text { font-size:22px; fill:var(--muted); }
.legend-frozen { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.legend-trained { fill:var(--amber-bg); stroke:var(--amber); stroke-width:2; }
.legend-unverified { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:5 4; }
.tag,.legend-text {font-size:24px;} text {line-height:1.1;}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" width="640" height="704"/>
<text x="24" y="36" class="heading" text-anchor="start">Only outgoing digit votes change;</text>
<text x="24" y="80" class="heading" text-anchor="start">native arithmetic stays</text>
<rect class="legend-trained" x="24" y="98" width="24" height="20" rx="3"/>
<text x="58" y="116" class="legend-text" text-anchor="start">trained</text>
<rect class="legend-unverified" x="214" y="98" width="24" height="20" rx="3"/>
<text x="248" y="116" class="legend-text" text-anchor="start">not verified</text>
<text x="24" y="690" class="note" text-anchor="start">Task example, not a measurement.</text>
<path class="bus-line" d="M 320 612 V 184" marker-end="url(#tip)"/>
<text x="352" y="600" class="note" text-anchor="start">residual stream</text>
<g class="output">
<rect class="node" x="24" y="128" width="592" height="56" rx="10"/>
<text x="42" y="166" class="node-title" text-anchor="start">Next scratch digit</text>
</g>
<g class="trained uncertain">
<rect class="node" x="352" y="244" width="264" height="76" rx="10"/>
<text x="370" y="278" class="node-title" text-anchor="start">Digit votes only</text>
<text x="370" y="312" class="detail" text-anchor="start">Replace output map</text>
</g>
<g class="trained">
<rect class="node" x="352" y="368" width="264" height="76" rx="10"/>
<text x="370" y="402" class="node-title" text-anchor="start">Neuron signals</text>
<text x="370" y="436" class="detail" text-anchor="start">Incoming map stays</text>
</g>
<path class="arrow" d="M 320 460 L 382 460 L 382 444" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 382 368 L 382 320" marker-end="url(#tip)"/>
<text x="360" y="354" class="value-label" text-anchor="start">native signals</text>
<path class="arrow uncertain" d="M 382 244 L 382 224 L 320 224" marker-end="url(#tip)"/>
<text x="360" y="214" class="value-label" text-anchor="start">digit target 1</text>
<text x="24" y="300" class="note" text-anchor="start">Other native writes</text>
<text x="24" y="338" class="note" text-anchor="start">stay on the stream</text>
<path class="arrow" d="M 320 586 L 258 586 L 258 568" marker-end="url(#tip)"/>
<path class="arrow" d="M 258 492 L 258 472 L 320 472" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="586" r="4"/>
<circle class="junction" cx="320" cy="472" r="4"/>
<text x="280" y="602" class="value-label" text-anchor="end">prompt 007*003=</text>
<g class="trained">
<rect class="node" x="24" y="492" width="264" height="76" rx="10"/>
<text x="42" y="526" class="node-title" text-anchor="start">Build context</text>
<text x="42" y="560" class="detail" text-anchor="start">Native trained layers</text>
</g>
<g class="input">
<rect class="node" x="24" y="612" width="592" height="44" rx="10"/>
<text x="42" y="644" class="node-title" text-anchor="start">Input: decimal 007*003=</text>
</g>
</svg>
