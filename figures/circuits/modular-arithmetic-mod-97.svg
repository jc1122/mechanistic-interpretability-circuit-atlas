<svg xmlns="http://www.w3.org/2000/svg" width="640" height="704" viewBox="0 0 640 704" role="img" aria-labelledby="title desc">
<title id="title">Hand-built inputs use exponents; trained inputs use circles</title>
<desc id="desc">Alternative token multiplication networks, not successive stages: hand-built scalar-exponent and trained-from-scratch circular-exponent codes. Each lane has its own thin residual stream. HAND embeds scalar exponents 1,2 for tokens 5,25, adds them to 3 and looks up product 28. All ten final token-multiplier embeddings at fraction .9 use circular codes in exponent order, not scalar registers. Their internal arithmetic is unrecovered and dashed; 28 is a task target, not a ten-seed success claim. The separate Partial output-only surrogate uses true external logs, is not drawn as a native stage, and leaves internal arithmetic and the complement unverified. Zero and digit formats are outside this nonzero-token illustration.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
.trained .node { fill:var(--amber-bg); stroke:var(--amber); }
.register .node { fill:var(--blue-bg); stroke:var(--blue); }
.register-line { stroke:var(--blue); stroke-width:3; }
.unused .node { fill:var(--idle); }
.uncertain .node, .uncertain.arrow { stroke-dasharray:8 6; }
.node-title { font-size:28px; font-weight:650; }
.detail { font-size:24px; }
.tag { font-size:22px; font-weight:600; fill:var(--muted); }
.heading { font-size:30px; font-weight:700; }
.note { font-size:24px; fill:var(--muted); }
.arrow { fill:none; stroke:var(--line); stroke-width:2.5; }
.arrowhead { fill:var(--line); }
.arrow-label { font-size:24px; fill:var(--muted); paint-order:stroke;
  stroke:var(--bg); stroke-width:8; stroke-linejoin:round; }
.example-bg { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.bus-band { fill:none; stroke:var(--line); stroke-width:10; opacity:.14; }
.bus-line { fill:none; stroke:var(--line); stroke-width:2.5; }
.junction { fill:var(--line); }
.lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 7; }
.value-label { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:24px; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:8; stroke-linejoin:round; }
.legend-text { font-size:22px; fill:var(--muted); }
.legend-frozen { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.legend-trained { fill:var(--amber-bg); stroke:var(--amber); stroke-width:2; }
.legend-unverified { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:5 4; }
.tag,.legend-text {font-size:24px;} text {line-height:1.1;}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" width="640" height="704"/>
<text x="24" y="36" class="heading" text-anchor="start">Hand-built inputs use exponents;</text>
<text x="24" y="80" class="heading" text-anchor="start">trained inputs use circles</text>
<rect class="legend-frozen" x="24" y="98" width="24" height="20" rx="3"/>
<text x="58" y="116" class="legend-text" text-anchor="start">frozen</text>
<rect class="legend-trained" x="214" y="98" width="24" height="20" rx="3"/>
<text x="248" y="116" class="legend-text" text-anchor="start">trained</text>
<rect class="legend-unverified" x="404" y="98" width="24" height="20" rx="3"/>
<text x="438" y="116" class="legend-text" text-anchor="start">not verified</text>
<text x="24" y="690" class="note" text-anchor="start">Task example, not a measurement.</text>
<rect class="lane" x="24" y="242" width="288" height="350" rx="12"/>
<rect class="lane" x="328" y="242" width="288" height="350" rx="12"/>
<text x="80" y="272" class="tag" text-anchor="start">hand-built</text>
<text x="368" y="272" class="tag" text-anchor="start">trained from scratch</text>
<path class="bus-line" d="M 44 620 V 184" marker-end="url(#tip)"/>
<path class="bus-line" d="M 348 620 V 184" marker-end="url(#tip)"/>
<text x="80" y="224" class="note" text-anchor="start">residual stream</text>
<g class="output">
<rect class="node" x="24" y="128" width="592" height="56" rx="10"/>
<text x="42" y="166" class="node-title" text-anchor="start">Modular product token</text>
</g>
<path class="arrow" d="M 44 440 L 110 440 L 110 418" marker-end="url(#tip)"/>
<path class="arrow" d="M 110 342 L 110 294 L 44 294" marker-end="url(#tip)"/>
<circle class="junction" cx="44" cy="440" r="4"/>
<circle class="junction" cx="44" cy="294" r="4"/>
<text x="80" y="326" class="value-label" text-anchor="start">product = 28</text>
<g class="process">
<rect class="node" x="80" y="342" width="224" height="76" rx="10"/>
<text x="98" y="376" class="node-title" text-anchor="start">Add; look up</text>
<text x="98" y="410" class="detail" text-anchor="start">Sum = 3; lookup</text>
</g>
<path class="arrow uncertain" d="M 348 440 L 414 440 L 414 418" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 414 342 L 414 294 L 348 294" marker-end="url(#tip)"/>
<circle class="junction" cx="348" cy="440" r="4"/>
<circle class="junction" cx="348" cy="294" r="4"/>
<text x="384" y="326" class="value-label" text-anchor="start">target = 28</text>
<g class="trained uncertain">
<rect class="node" x="384" y="342" width="224" height="76" rx="10"/>
<text x="402" y="376" class="node-title" text-anchor="start">Process code</text>
<text x="402" y="410" class="detail" text-anchor="start">Rule unrecovered</text>
</g>
<path class="arrow" d="M 44 584 L 110 584 L 110 566" marker-end="url(#tip)"/>
<path class="arrow" d="M 110 490 L 110 466 L 44 466" marker-end="url(#tip)"/>
<circle class="junction" cx="44" cy="584" r="4"/>
<circle class="junction" cx="44" cy="466" r="4"/>
<text x="80" y="606" class="value-label" text-anchor="start">tokens 5,25</text>
<text x="80" y="480" class="value-label" text-anchor="start">codes = 1,2</text>
<g class="process">
<rect class="node" x="80" y="490" width="224" height="76" rx="10"/>
<text x="98" y="524" class="node-title" text-anchor="start">Exponents</text>
<text x="98" y="558" class="detail" text-anchor="start">Scalar code</text>
</g>
<path class="arrow" d="M 348 584 L 414 584 L 414 566" marker-end="url(#tip)"/>
<path class="arrow" d="M 414 490 L 414 466 L 348 466" marker-end="url(#tip)"/>
<circle class="junction" cx="348" cy="584" r="4"/>
<circle class="junction" cx="348" cy="466" r="4"/>
<text x="384" y="606" class="value-label" text-anchor="start">tokens 5,25</text>
<text x="384" y="480" class="value-label" text-anchor="start">circle code</text>
<g class="trained">
<rect class="node" x="384" y="490" width="224" height="76" rx="10"/>
<text x="402" y="524" class="node-title" text-anchor="start">Circle code</text>
<text x="402" y="558" class="detail" text-anchor="start">Exponent order</text>
</g>
<g class="input">
<rect class="node" x="24" y="620" width="592" height="44" rx="10"/>
<text x="42" y="652" class="node-title" text-anchor="start">Input tokens: 5 × 25 mod 97</text>
</g>
</svg>
