<svg xmlns="http://www.w3.org/2000/svg" width="640" height="704" viewBox="0 0 640 704" role="img" aria-labelledby="title desc">
<title id="title">The reference fetches by name; trained fetches follow trace order</title>
<desc id="desc">Read upwards. HAND uses register tags to fetch operands before adding bits and carry. Final TRAIN uses trace order, with an adder role and a causal carry, but free-register STEP fails. The binary addition is a task target, not a claim that TRAIN emits it. A native name-based fetch and complete TRAIN formula were not recovered. The residual bus denotes information availability, not verified sparse edges. Values illustrate the task, not measured activations.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
.trained .node { fill:var(--amber-bg); stroke:var(--amber); }
.register .node { fill:var(--blue-bg); stroke:var(--blue); }
.register-line { stroke:var(--blue); stroke-width:3; }
.unused .node { fill:var(--idle); }
.uncertain .node, .uncertain.arrow { stroke-dasharray:8 6; }
.node-title { font-size:28px; font-weight:650; }
.detail { font-size:24px; }
.tag { font-size:22px; font-weight:600; fill:var(--muted); }
.heading { font-size:30px; font-weight:700; }
.note { font-size:24px; fill:var(--muted); }
.arrow { fill:none; stroke:var(--line); stroke-width:2.5; }
.arrowhead { fill:var(--line); }
.arrow-label { font-size:24px; fill:var(--muted); paint-order:stroke;
  stroke:var(--bg); stroke-width:8; stroke-linejoin:round; }
.example-bg { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.bus-band { fill:none; stroke:var(--line); stroke-width:10; opacity:.14; }
.bus-line { fill:none; stroke:var(--line); stroke-width:2.5; }
.junction { fill:var(--line); }
.lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 7; }
.value-label { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:24px; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:8; stroke-linejoin:round; }
.legend-text { font-size:22px; fill:var(--muted); }
.legend-frozen { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.legend-trained { fill:var(--amber-bg); stroke:var(--amber); stroke-width:2; }
.legend-unverified { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:5 4; }
.tag,.legend-text {font-size:24px;} text {line-height:1.1;}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" width="640" height="704"/>
<text x="24" y="36" class="heading" text-anchor="start">The reference fetches by name;</text>
<text x="24" y="80" class="heading" text-anchor="start">trained fetches follow trace order</text>
<rect class="legend-frozen" x="24" y="106" width="24" height="20" rx="3"/>
<text x="58" y="124" class="legend-text" text-anchor="start">frozen</text>
<rect class="legend-trained" x="214" y="106" width="24" height="20" rx="3"/>
<text x="248" y="124" class="legend-text" text-anchor="start">trained</text>
<rect class="legend-unverified" x="404" y="106" width="24" height="20" rx="3"/>
<text x="438" y="124" class="legend-text" text-anchor="start">not verified</text>
<text x="24" y="690" class="note" text-anchor="start">Task example, not a measurement.</text>
<path class="bus-line" d="M 36 612 V 184" marker-end="url(#tip)"/>
<text x="86" y="166" class="detail" text-anchor="start">Hand-built</text>
<path class="arrow" d="M 36 570 L 94 570 L 94 528" marker-end="url(#tip)"/>
<text x="120" y="560" class="value-label" text-anchor="start">bits = 101,11</text>
<path class="arrow" d="M 94 440 L 94 390 L 36 390" marker-end="url(#tip)"/>
<g class="process">
<rect class="node" x="86" y="440" width="222" height="88" rx="10"/>
<text x="104" y="480" class="node-title" text-anchor="start">Fetch names</text>
<text x="104" y="514" class="detail" text-anchor="start">attention</text>
</g>
<path class="arrow" d="M 36 378 L 94 378 L 94 334" marker-end="url(#tip)"/>
<path class="arrow" d="M 94 246 L 94 210 L 36 210" marker-end="url(#tip)"/>
<text x="120" y="200" class="value-label" text-anchor="start">sum = 1000</text>
<g class="process">
<rect class="node" x="86" y="246" width="222" height="88" rx="10"/>
<text x="104" y="286" class="node-title" text-anchor="start">Add bits</text>
<text x="104" y="320" class="detail" text-anchor="start">layer-3 block</text>
</g>
<path class="bus-line" d="M 344 612 V 184" marker-end="url(#tip)"/>
<text x="394" y="166" class="detail" text-anchor="start">Trained from scratch</text>
<path class="arrow" d="M 344 570 L 402 570 L 402 528" marker-end="url(#tip)"/>
<text x="428" y="560" class="value-label" text-anchor="start">bits = 101,11</text>
<path class="arrow" d="M 402 440 L 402 390 L 344 390" marker-end="url(#tip)"/>
<g class="trained">
<rect class="node" x="394" y="440" width="222" height="88" rx="10"/>
<text x="412" y="480" class="node-title" text-anchor="start">Fetch order</text>
<text x="412" y="514" class="detail" text-anchor="start">attention</text>
</g>
<path class="arrow" d="M 344 378 L 402 378 L 402 334" marker-end="url(#tip)"/>
<path class="arrow" d="M 402 246 L 402 210 L 344 210" marker-end="url(#tip)"/>
<text x="428" y="200" class="value-label" text-anchor="start">step may fail</text>
<g class="trained">
<rect class="node" x="394" y="246" width="222" height="88" rx="10"/>
<text x="412" y="286" class="node-title" text-anchor="start">Adder role</text>
<text x="412" y="320" class="detail" text-anchor="start">layer-3 block</text>
</g>
<text x="86" y="612" class="note" text-anchor="start">Residual streams</text>
<text x="24" y="656" class="detail" text-anchor="start">Binary task: 101 + 11 has target 1000</text>
</svg>
