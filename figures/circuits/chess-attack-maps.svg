<circle class="junction" cx="320" cy="610" r="4"/>
<circle class="junction" cx="320" cy="504" r="4"/>
<g class="trained uncertain">
<rect class="node" x="368" y="524" width="248" height="76" rx="10"/>
<text x="386" y="558" class="node-title" text-anchor="start">Build context</text>
<text x="386" y="592" class="detail" text-anchor="start">layers 0–2</text>
</g>
<path class="arrow uncertain" d="M 320 478 L 242 478 L 242 460" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 242 384 L 242 364 L 320 364" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="478" r="4"/>
<circle class="junction" cx="320" cy="364" r="4"/>
<g class="trained uncertain">
<rect class="node" x="24" y="384" width="248" height="76" rx="10"/>
<text x="42" y="418" class="node-title" text-anchor="start">Read piece</text>
<text x="42" y="452" class="detail" text-anchor="start">layer 3, marker</text>
</g>
<text x="32" y="354" class="value-label" text-anchor="start">piece = knight</text>
<path class="arrow uncertain" d="M 320 478 L 398 478 L 398 460" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 398 384 L 398 364 L 320 364" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="478" r="4"/>
<circle class="junction" cx="320" cy="364" r="4"/>
<g class="trained uncertain">
<rect class="node" x="368" y="384" width="248" height="76" rx="10"/>
<text x="386" y="418" class="node-title" text-anchor="start">Read square</text>
<text x="386" y="452" class="detail" text-anchor="start">layer 3, square</text>
</g>
<text x="420" y="354" class="value-label" text-anchor="start">b3 = empty</text>
<path class="arrow uncertain" d="M 320 338 L 398 338 L 398 320" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 398 244 L 398 224 L 320 224" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="338" r="4"/>
<circle class="junction" cx="320" cy="224" r="4"/>
<g class="trained uncertain">
