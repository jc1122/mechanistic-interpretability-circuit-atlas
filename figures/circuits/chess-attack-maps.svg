<text x="386" y="278" class="node-title" text-anchor="start">Write tokens</text>
<text x="386" y="312" class="detail" text-anchor="start">layer 3 neurons</text>
</g>
<text x="376" y="214" class="value-label" text-anchor="start">b3 bit = 1</text>
<g class="output">
<rect class="node" x="24" y="128" width="592" height="56" rx="10"/>
<text x="42" y="166" class="node-title" text-anchor="start">Target: list b3; mark its map bit 1</text>
</g>
<g class="input">
<rect class="node" x="24" y="612" width="592" height="76" rx="10"/>
<text x="42" y="646" class="node-title" text-anchor="start">Board: White knight a1, king h1</text>
<text x="42" y="680" class="detail" text-anchor="start">Black king h8; requested colour White</text>
</g>
</svg>
