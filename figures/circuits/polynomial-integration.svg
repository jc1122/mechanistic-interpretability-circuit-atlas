<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
<title id="title">A token-count pool is described; fraction reduction is still unknown</title>
<desc id="desc">All prefix tokens feed trained layer-0 attention, whose partial substitute weights token identities by their counts; the shown coefficient token C:6 occurs once. A distinct supplied-history input gives G:2, common factor 2. Essential feed-forward blocks have no recovered reduction rule. The target for coefficient 6 at term power 2 is N:3 D:1, numerator 3 and denominator 1. One upward residual stream shows availability, not verified scratchpad wiring. Dashed parts are not verified; no native numerical mixture or gcd/division algorithm is claimed. All ten final from-scratch scratchpad seeds, including failed seed 4, have a substitution-supported prefix pool unlike the hand-built design: the C:6 coefficient token occurs once, while G:2 supplies common factor 2 from correct history; this partial component/input map does not recover common-factor reduction or division, verified scratchpad wiring or a complement test.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
.trained .node { fill:var(--amber-bg); stroke:var(--amber); }
.register .node { fill:var(--blue-bg); stroke:var(--blue); }
.register-line { stroke:var(--blue); stroke-width:3; }
.unused .node { fill:var(--idle); }
.uncertain .node, .uncertain.arrow { stroke-dasharray:8 6; }
.node-title { font-size:28px; font-weight:650; }
.detail { font-size:24px; }
.tag { font-size:22px; font-weight:600; fill:var(--muted); }
.heading { font-size:30px; font-weight:700; }
.note { font-size:24px; fill:var(--muted); }
.arrow { fill:none; stroke:var(--line); stroke-width:2.5; }
.arrowhead { fill:var(--line); }
.arrow-label { font-size:24px; fill:var(--muted); paint-order:stroke;
  stroke:var(--bg); stroke-width:8; stroke-linejoin:round; }
.example-bg { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.bus-band { fill:none; stroke:var(--line); stroke-width:10; opacity:.14; }
.bus-line { fill:none; stroke:var(--line); stroke-width:2.5; }
.junction { fill:var(--line); }
.lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 7; }
.value-label { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:24px; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:8; stroke-linejoin:round; }
.legend-text { font-size:22px; fill:var(--muted); }
.legend-frozen { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.legend-trained { fill:var(--amber-bg); stroke:var(--amber); stroke-width:2; }
.legend-unverified { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:5 4; }
.tag,.legend-text {font-size:24px;} text {line-height:1.1;}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" width="640" height="700"/>
<text x="20" y="38" class="heading" text-anchor="start">A token-count pool is described;</text>
<text x="20" y="82" class="heading" text-anchor="start">fraction reduction is still unknown</text>
<rect class="legend-trained" x="20" y="100" width="24" height="20" rx="3"/>
<text x="54" y="118" class="legend-text" text-anchor="start">trained</text>
<rect class="legend-unverified" x="200" y="100" width="24" height="20" rx="3"/>
<text x="234" y="118" class="legend-text" text-anchor="start">not verified</text>
<path class="bus-line" d="M 320 616 V 218" marker-end="url(#tip)"/>
<style>.bus-band{display:none}</style>
<text x="340" y="428" class="note" text-anchor="start">residual stream</text>
<path class="arrow uncertain" d="M 320 610 L 40 610 L 40 578" marker-end="url(#tip)"/>
<text x="56" y="602" class="value-label" text-anchor="start">C:6 count 1</text>
<path class="arrow uncertain" d="M 40 466 L 40 460 L 320 460" marker-end="url(#tip)"/>
<text x="56" y="452" class="value-label" text-anchor="start">token mixture</text>
<g class="trained uncertain">
<rect class="node" x="20" y="466" width="260" height="112" rx="12"/>
<text x="42" y="494" class="tag" text-anchor="start">not verified</text>
<text x="42" y="531" class="node-title" text-anchor="start">Pool all tokens</text>
<text x="42" y="565" class="detail" text-anchor="start">layer 0 attention</text>
</g>
<path class="arrow uncertain" d="M 320 426 L 40 426 L 40 390" marker-end="url(#tip)"/>
<text x="56" y="418" class="value-label" text-anchor="start">prefix mixture</text>
<path class="arrow uncertain" d="M 40 278 L 40 254 L 320 254" marker-end="url(#tip)"/>
<text x="56" y="246" class="value-label" text-anchor="start">fraction scores</text>
<g class="trained uncertain">
<rect class="node" x="20" y="278" width="260" height="112" rx="12"/>
<text x="42" y="306" class="tag" text-anchor="start">not verified</text>
<text x="42" y="343" class="node-title" text-anchor="start">Reduction rule?</text>
<text x="42" y="377" class="detail" text-anchor="start">all neuron blocks</text>
</g>
<g class="input">
<rect class="node" x="360" y="480" width="260" height="100" rx="12"/>
<text x="382" y="522" class="node-title" text-anchor="start">Given factor</text>
<text x="382" y="556" class="detail" text-anchor="start">correct history</text>
</g>
<path class="arrow" d="M 600 580 L 600 612 L 320 612" marker-end="url(#tip)"/>
<text x="342" y="604" class="value-label" text-anchor="start">G:2 factor 2</text>
<g class="output">
<rect class="node" x="20" y="138" width="600" height="80" rx="12"/>
<text x="42" y="170" class="node-title" text-anchor="start">Targets: N:3 and D:1</text>
<text x="42" y="204" class="detail" text-anchor="start">Numerator 3; denominator 1; term power 2</text>
</g>
<text x="20" y="654" class="detail" text-anchor="start">Prompt has C:4, C:6: coefficients 4 and 6</text>
<text x="20" y="688" class="note" text-anchor="start">Task example, not a measurement.</text>
</svg>
