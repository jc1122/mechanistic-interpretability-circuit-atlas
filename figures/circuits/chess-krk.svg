<circle class="junction" cx="320" cy="364" r="4"/>
<g class="trained uncertain">
<rect class="node" x="368" y="384" width="248" height="76" rx="10"/>
<text x="386" y="418" class="node-title" text-anchor="start">Read locations</text>
<text x="386" y="452" class="detail" text-anchor="start">layer 5 heads</text>
</g>
<path class="arrow uncertain" d="M 320 338 L 398 338 L 398 320" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 398 244 L 398 224 L 320 224" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="338" r="4"/>
<circle class="junction" cx="320" cy="224" r="4"/>
<g class="trained uncertain">
<rect class="node" x="368" y="244" width="248" height="76" rx="10"/>
<text x="386" y="278" class="node-title" text-anchor="start">Decode target</text>
<text x="386" y="312" class="detail" text-anchor="start">layer 5 neurons</text>
</g>
<text x="376" y="214" class="value-label" text-anchor="start">target unknown</text>
<path class="arrow uncertain" d="M 320 338 L 242 338 L 242 320" marker-end="url(#tip)"/>
<path class="arrow uncertain" d="M 242 244 L 242 224 L 320 224" marker-end="url(#tip)"/>
<circle class="junction" cx="320" cy="338" r="4"/>
<circle class="junction" cx="320" cy="224" r="4"/>
<g class="trained uncertain">
<rect class="node" x="24" y="244" width="248" height="76" rx="10"/>
<text x="42" y="278" class="node-title" text-anchor="start">Source copy</text>
<text x="42" y="312" class="detail" text-anchor="start">else: rook square</text>
</g>
<text x="32" y="214" class="value-label" text-anchor="start">source = king</text>
<text x="32" y="370" class="value-label" text-anchor="start">phase = APPROACH</text>
<g class="output">
