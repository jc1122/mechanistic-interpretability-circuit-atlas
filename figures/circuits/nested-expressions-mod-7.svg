<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
<title id="title">The parser writes the winning remainder after division by 7</title>
<desc id="desc">The parser writes the winning remainder after division by 7. One upward residual stream has separate read/write branches for Read top stack (layer 2 heads); Shift / copy (other parser actions); Score residues (trained arithmetic). Given stack: 2 + 6; arithmetic is modulo 7; Next stack: 1. Task values are illustrative; dashed boxes and branches are not verified. Final partly trained seeds 0–9 keep the hand-built parser but use a different residue-score code whose winning remainder after division by 7 feeds its frozen stack writer; the local block is verified, not a learned parser, with no untouched test and small diagnostic/stress sets. The bus shows architectural information availability, not a new sparse-edge certificate.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
.trained .node { fill:var(--amber-bg); stroke:var(--amber); }
.register .node { fill:var(--blue-bg); stroke:var(--blue); }
.register-line { stroke:var(--blue); stroke-width:3; }
.unused .node { fill:var(--idle); }
.uncertain .node, .uncertain.arrow { stroke-dasharray:8 6; }
.node-title { font-size:28px; font-weight:650; }
.detail { font-size:24px; }
.tag { font-size:22px; font-weight:600; fill:var(--muted); }
.heading { font-size:30px; font-weight:700; }
.note { font-size:24px; fill:var(--muted); }
.arrow { fill:none; stroke:var(--line); stroke-width:2.5; }
.arrowhead { fill:var(--line); }
.arrow-label { font-size:24px; fill:var(--muted); paint-order:stroke;
  stroke:var(--bg); stroke-width:8; stroke-linejoin:round; }
.example-bg { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.bus-band { fill:none; stroke:var(--line); stroke-width:10; opacity:.14; }
.bus-line { fill:none; stroke:var(--line); stroke-width:2.5; }
.junction { fill:var(--line); }
.lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 7; }
.value-label { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:24px; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:8; stroke-linejoin:round; }
.legend-text { font-size:22px; fill:var(--muted); }
.legend-frozen { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.legend-trained { fill:var(--amber-bg); stroke:var(--amber); stroke-width:2; }
.legend-unverified { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:5 4; }
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
<rect class="canvas" width="640" height="700"/>
<style>.tag,.legend-text{font-size:24px}.bus-band{display:none}</style>
<text x="20" y="38" class="heading" text-anchor="start">The parser writes the winning</text>
<text x="20" y="82" class="heading" text-anchor="start">remainder after division by 7</text>
<rect class="legend-frozen" x="20" y="100" width="24" height="20" rx="3"/>
<text x="54" y="118" class="legend-text" text-anchor="start">frozen</text>
<rect class="legend-trained" x="200" y="100" width="24" height="20" rx="3"/>
<text x="234" y="118" class="legend-text" text-anchor="start">trained</text>
<path class="bus-line" d="M 320 610 V 218" marker-end="url(#tip)"/>
<text x="340" y="618" class="note" text-anchor="start">residual stream</text>
<path class="arrow" d="M 320 590 L 40 590 L 40 550" marker-end="url(#tip)"/>
<text x="56" y="582" class="value-label" text-anchor="start">stack 2 + 6</text>
<path class="arrow" d="M 40 470 L 40 458 L 320 458" marker-end="url(#tip)"/>
<text x="56" y="450" class="value-label" text-anchor="start">values 2, +, 6</text>
<g class="process">
<rect class="node" x="20" y="470" width="260" height="80" rx="12"/>
<text x="42" y="502" class="node-title" text-anchor="start">Read top stack</text>
<text x="42" y="536" class="detail" text-anchor="start">layer 2 heads</text>
</g>
<path class="arrow" d="M 320 590 L 600 590 L 600 550" marker-end="url(#tip)"/>
<text x="342" y="582" class="value-label" text-anchor="start">other actions</text>
<path class="arrow" d="M 600 470 L 600 458 L 320 458" marker-end="url(#tip)"/>
<text x="342" y="450" class="value-label" text-anchor="start">copied cells</text>
<g class="process">
<rect class="node" x="360" y="470" width="260" height="80" rx="12"/>
<text x="382" y="502" class="node-title" text-anchor="start">Shift / copy</text>
<text x="382" y="536" class="detail" text-anchor="start">other parser actions</text>
</g>
<path class="arrow" d="M 320 422 L 40 422 L 40 384" marker-end="url(#tip)"/>
<text x="56" y="414" class="value-label" text-anchor="start">values 2, +, 6</text>
<path class="arrow" d="M 40 272 L 40 254 L 320 254" marker-end="url(#tip)"/>
<text x="56" y="246" class="value-label" text-anchor="start">winner = 1</text>
<g class="trained">
<rect class="node" x="20" y="272" width="260" height="112" rx="12"/>
<text x="42" y="320" class="node-title" text-anchor="start">Score residues</text>
<text x="42" y="354" class="detail" text-anchor="start">trained arithmetic</text>
</g>
<g class="process">
<rect class="node" x="20" y="138" width="600" height="80" rx="12"/>
<text x="42" y="170" class="node-title" text-anchor="start">Next stack: 1</text>
<text x="42" y="204" class="detail" text-anchor="start">Frozen stack writer reads the winning score</text>
</g>
<text x="20" y="654" class="detail" text-anchor="start">Given stack: 2 + 6; arithmetic is modulo 7</text>
<text x="20" y="688" class="note" text-anchor="start">Task example, not a measurement.</text>
</svg>
