<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
<title id="title">All layers matter for expansion; the product rule remains unknown</title>
<desc id="desc">Three layers branch from one upward residual stream. In each row, trained heads read context and return it to the stream before that layer’s feed-forward neuron block reads and updates it. Layer-0 and layer-1 heads are fetch heads; layer-2 heads feed the final neuron block and answer scores. All heads and blocks are retained, not just one strongest head. Input term atoms mean (2x+1)(3x+4); one product query has coefficients 2 and 3, target atom 6. Correct earlier tokens are supplied separately during scoring; arrows do not establish autonomous rollout. Dashed borders mean no verified product formula, not that component necessity is untested. The ten final from-scratch scratchpad expansion seeds retain every layer’s heads and feed-forward block (MLP), differing from the hand-built design: coefficients 2 and 3 have product target 6 within (2x+1)(3x+4) = 6x²+11x+4, with correct earlier tokens supplied, no accepted product formula or notation parser; the whole-network complement is empty rather than a compact certificate, and seed 3’s final snapshot is inexact. Unlabelled short connectors carry context with no recovered native values.</desc>
<style>
:root { color-scheme: light dark;
  --bg:#ffffff; --fg:#172330; --muted:#46586a; --line:#526678;
  --panel:#f4f7fa; --blue:#00679e; --blue-bg:#eaf5fc;
  --amber:#885000; --amber-bg:#fff4dc;
  --purple:#70509c; --purple-bg:#f3edfa; --idle:#eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101820; --fg:#f2f5f8; --muted:#c2ced9; --line:#b0bfcd;
    --panel:#1c2a36; --blue:#79c8f5; --blue-bg:#132f43;
    --amber:#f2c566; --amber-bg:#352b18;
    --purple:#cbb1ee; --purple-bg:#30263e; --idle:#26313b; }
}
text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  fill:var(--fg); font-variant-numeric:tabular-nums; }
.canvas { fill:var(--bg); }
.node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
.input .node { fill:var(--blue-bg); stroke:var(--blue); }
.output .node { fill:var(--purple-bg); stroke:var(--purple); }
