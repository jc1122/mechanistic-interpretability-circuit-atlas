title: Mechanistic Interpretability Circuit Atlas
description: Small-network circuit studies for algorithmic tasks, with hand-built references and their limits.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-github-metadata
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: {path: ""}
    values: {layout: default}
